---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-config"
  - package-ecosystem: pip
    directory: "/" # Location of package manifests
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    ignore:
      # pytest-homeassistant pins pytest EXACTLY, because it carries HA core's
      # test requirements. Raising our floor past that pin cannot resolve,
      # however long the pull request stays open, so the only move is to let
      # pytest-homeassistant bring pytest forward on its own schedule.
      - dependency-name: pytest
      # These mirror the versions Home Assistant pins in its integration
      # manifests and its own requirements. Dependabot would move them to their
      # newest releases instead, ahead of the Home Assistant under test, so they
      # move by hand with pytest-homeassistant.
      # test_dev_requirements_match_the_home_assistant_under_test names any
      # left behind, and fails if one pinned by Home Assistant is missing here.
      - dependency-name: "aioesphomeapi"
      - dependency-name: "aiofiles"
      - dependency-name: "aiohasupervisor"
      - dependency-name: "aiousbwatcher"
      - dependency-name: "av"
      - dependency-name: "debugpy"
      - dependency-name: "fnv-hash-fast"
      - dependency-name: "ha-silabs-firmware-client"
      - dependency-name: "matter-python-client"
      - dependency-name: "numpy"
      - dependency-name: "psutil-home-assistant"
      - dependency-name: "pyserial"
      - dependency-name: "PyTurboJPEG"
      - dependency-name: "SQLAlchemy"
      - dependency-name: "universal-silabs-flasher"
      - dependency-name: "zha"
      - dependency-name: "zha-quirks"
      - dependency-name: "zwave-js-server-python"
    groups:
      homeassistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant"
  - package-ecosystem: npm
    directory: "/" # Location of package manifests
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
