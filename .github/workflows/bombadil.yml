---
name: Bombadil property tests

# GHA requires bare `on:` which yamllint sees as boolean
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bombadil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/jod
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Warm Chrome
        # A cold runner's first Chrome launch can take several seconds to
        # open its DevTools port, and Bombadil 0.7.3+ gives it three. The
        # second launch takes well under one.
        run: |
          google-chrome-stable --headless --no-sandbox \
            --user-data-dir="$(mktemp -d)" --remote-debugging-port=9222 \
            about:blank >/dev/null 2>&1 &
          for _ in $(seq 1 80); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 0.25
          done
          kill $! || true
      - name: Run Bombadil exploration
        env:
          BOMBADIL_HEADLESS: "1"
          BOMBADIL_TIME_LIMIT: 5m
        run: yarn test:pbt
      - name: Upload trace on violation
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bombadil-output
          path: pbt-output/
