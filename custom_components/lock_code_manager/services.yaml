---
hard_refresh_usercodes:
  target:
    entity:
      domain: lock

add_user:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    users:
      required: true
      example: |
        - name: Sarah Chen
          pin: "1234"
        - name: Courier
          pin: "9876"
          enabled: false
      selector:
        object:
          multiple: true
          label_field: name
          description_field: pin
          fields:
            name:
              label: Name
              required: true
              selector:
                text:
            pin:
              label: PIN
              selector:
                text:
            enabled:
              label: Enabled
              selector:
                boolean:
            condition:
              label: Condition entity
              selector:
                entity:
                  domain:
                    - binary_sensor
                    - calendar
                    - input_boolean
                    - schedule
                    - switch
delete_user:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    name:
      required: true
      example: '[\"Sarah Chen\", \"Courier\"]'
      selector:
        text:
          multiple: true
    clear_credentials:
      default: true
      selector:
        boolean:

generate_pin:
  fields:
    length:
      default: 4
      example: 4
      selector:
        number:
          min: 4
          max: 12
          step: 1
          mode: box

deobfuscate_log:
  fields:
    text:
      required: true
      selector:
        text:
          multiline: true

use_credential:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    code:
      required: true
      selector:
        text:
    source:
      required: true
      selector:
        entity:
    target:
      required: true
      selector:
        entity:

set_credential:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    name:
      required: true
      selector:
        text:
    credential_type:
      required: true
      default: pin
      selector:
        select:
          translation_key: credential_type
          options:
            - pin
            - rfid
            - fingerprint
            - face
            - password
            - nfc
    value:
      required: true
      selector:
        text:
    enable_if_disabled:
      default: false
      selector:
        boolean:

clear_credential:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    name:
      required: true
      selector:
        text:
    credential_type:
      required: true
      default: pin
      selector:
        select:
          translation_key: credential_type
          options:
            - pin
            - rfid
            - fingerprint
            - face
            - password
            - nfc

enable_user:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    name:
      required: true
      selector:
        text:

disable_user:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    name:
      required: true
      selector:
        text:

set_condition:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    name:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain:
            - binary_sensor
            - calendar
            - input_boolean
            - schedule
            - switch

clear_condition:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: lock_code_manager
    config_entry_title:
      selector:
        text:
    name:
      required: true
      selector:
        text:
