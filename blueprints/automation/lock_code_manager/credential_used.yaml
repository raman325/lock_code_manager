---
blueprint:
  name: "Lock Code Manager: Credential Used"
  description: >
    Runs one or more actions every time a Lock Code Manager credential is
    used, whether Lock Code Manager saw it happen on a lock or was told
    about it through the `lock_code_manager.use_credential` action.


    **Which blueprint should I use?**


    Slot Usage Notifier and Slot Usage Limiter trigger on a user's
    credential used *entity*, so they only see uses that were recorded
    there — which means uses against a lock in the same Lock Code Manager
    configuration. A use reported through `lock_code_manager.use_credential`
    with any other target (a cover, an alarm panel, an entity Lock Code
    Manager does not manage) has no per-user entity to record against, so
    those two blueprints never see it.


    This blueprint triggers on the `lock_code_manager_credential_used`
    event instead, so it sees every credential use with no exceptions.
    Reach for the other two when you want the focused, per-user recipe;
    reach for this one when you want the whole picture.


    **Available template variables**


    Your actions can reference these variables in templates:

    - `name` — the name of the user whose credential was used

    - `source` — the entity ID where the credential was entered

    - `target` — the entity ID it was used against

    - `config_entry_id` — the ID of the Lock Code Manager configuration

    - `config_entry_title` — the title of that configuration

    - `timestamp` — the date and time the credential was used


    **Setup**


    1. Import this blueprint and create an automation from it.

    2. Leave every filter empty to act on every credential use, or fill in
       the ones you want to narrow by.

    3. Configure the actions to run.
  domain: automation
  # yamllint disable-line rule:line-length
  source_url: https://github.com/raman325/lock_code_manager/blob/main/blueprints/automation/lock_code_manager/credential_used.yaml
  input:
    config_entry:
      name: Lock Code Manager config entry (optional)
      description: >
        Restrict the automation to one Lock Code Manager configuration.
        When empty, credential uses from every configuration run the
        actions.
      default: ""
      selector:
        config_entry:
          integration: lock_code_manager
    users:
      name: Users (optional)
      description: >
        Restrict the automation to specific users, by the name shown in
        Lock Code Manager. When empty, every user's credential runs the
        actions. Names are matched exactly, so a user who is renamed must
        be updated here too.
      default: []
      selector:
        text:
          multiple: true
    sources:
      name: Sources (optional)
      description: >
        Restrict the automation to credentials entered on these entities —
        the keypad, reader, or lock the code was typed on. When empty, any
        source runs the actions.
      default: []
      selector:
        entity:
          multiple: true
    targets:
      name: Targets (optional)
      description: >
        Restrict the automation to credentials used against these entities
        — the lock, cover, or anything else the use applied to. When empty,
        any target runs the actions.
      default: []
      selector:
        entity:
          multiple: true
    credential_actions:
      name: Actions
      description: >
        The actions to run when a credential is used. You can configure any
        HA action here — notifications, scripts, etc. Use template variables
        like `{{ name }}` and `{{ target }}` in your action data.
      selector:
        action:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: lock_code_manager_credential_used

# Every field of the event is guaranteed present and non-empty, so none of
# these need a default or an existence check. That is the whole point of the
# event's fixed payload: an automation reads it without guards.
variables:
  config_entry: !input config_entry
  users: !input users
  sources: !input sources
  targets: !input targets
  name: "{{ trigger.event.data.name }}"
  source: "{{ trigger.event.data.source }}"
  target: "{{ trigger.event.data.target }}"
  config_entry_id: "{{ trigger.event.data.config_entry_id }}"
  config_entry_title: "{{ trigger.event.data.config_entry_title }}"
  timestamp: >-
    {{ trigger.event.time_fired | as_local
       | as_timestamp | timestamp_custom('%Y-%m-%d %H:%M:%S') }}

conditions:
  - condition: template
    value_template: >-
      {{ (config_entry == '' or config_entry_id == config_entry)
         and (users | count == 0 or name in users)
         and (sources | count == 0 or source in sources)
         and (targets | count == 0 or target in targets) }}

actions: !input credential_actions
