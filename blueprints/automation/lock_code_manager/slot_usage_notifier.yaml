---
blueprint:
  name: "Lock Code Manager: Slot Usage Notifier"
  description: >
    Runs one or more actions when a Lock Code Manager code slot PIN
    is used on a lock. Use this to send notifications, trigger scripts,
    or run any other Home Assistant action.


    **How it works**

    When a code slot event fires (PIN used on lock), the automation
    runs the configured actions. You can use the action editor to
    configure any HA action — notifications, scripts, scenes, etc.


    **Available template variables**

    Your actions can reference these variables in templates:

    - `slot_num` — the code slot number that was used

    - `slot_name` — the user-configured name of the code slot

    - `lock_name` — the friendly name of the lock where the PIN
      was used

    - `timestamp` — the date and time the event occurred

    - `operation` — what the device did with the credential: `unlock`,
      `lock`, or `unknown` when nothing reported which

    - `credential_type` — the kind of credential presented, `pin` today


    **What runs the actions**

    Every use recorded on the credential used event entity. That is a lock
    reporting which code slot unlocked it, a lock reporting which code slot
    *locked* it, and a use reported through the
    `lock_code_manager.use_credential` action from a keypad or door
    controller Home Assistant cannot watch.


    Every one of them runs the actions, including locking by code — a guest
    who unlocks with their PIN and locks up behind them with the same PIN
    runs them twice. Use `operation` in your message to say which happened,
    or to skip one kind with a condition inside your actions.


    **Setup**

    1. Import this blueprint and create an automation from it.

    2. Select one or more code slot event entities to monitor.

    3. Configure the actions to run when a credential is used.
  domain: automation
  # yamllint disable-line rule:line-length
  source_url: https://github.com/raman325/lock_code_manager/blob/main/blueprints/automation/lock_code_manager/slot_usage_notifier.yaml
  input:
    event_entity:
      name: Credential used event entities
      description: >
        One or more Lock Code Manager event entities that fire when a
        user's credential is used. Each is named for the user who holds
        the slot. The automation runs whenever any of them fire.
      selector:
        entity:
          domain: event
          integration: lock_code_manager
          multiple: true
    locks:
      name: Locks (optional)
      description: >
        Restrict the automation to a specific lock or set of locks.
        When empty, the actions run for any lock the event entity
        reports. When one or more locks are selected, the actions
        only run when one of those locks is the lock the credential
        was used on.
      default: []
      selector:
        entity:
          domain: lock
          multiple: true
    notify_actions:
      name: Actions
      description: >
        The actions to run when a credential is used. You can configure
        any HA action here — notifications, scripts, etc. Use
        template variables like `{{ slot_name }}` and
        `{{ lock_name }}` in your action data.
      selector:
        action:

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input event_entity
    not_to:
      - unknown
      - unavailable

variables:
  event_entity_id: !input event_entity
  locks: !input locks
  # Variables are computed before conditions run, so guard every
  # `trigger.to_state` access against the entity-removal case
  # (`to_state is None`) — otherwise the variable rendering errors
  # out before the conditions below can block the action.

  # `event_type` is the fixed word `credential_used` and names nothing;
  # `target` is what the credential was used against, which is a lock when
  # a lock observed the use and can be anything at all when the
  # `use_credential` action reported one.
  #
  # Read off the trigger's own snapshot rather than the entity's live state:
  # `mode: queued` runs this behind up to nine other uses, and a live read
  # would pair this trigger with whatever target arrived last.
  lock_entity_id: >-
    {{ trigger.to_state.attributes.target | default(none, true)
       if trigger.to_state is not none else none }}
  slot_name: >-
    {{ trigger.to_state.attributes.name | default('Unknown slot')
       if trigger.to_state is not none else 'Unknown slot' }}
  slot_num: >-
    {{ trigger.to_state.attributes.code_slot | default('?')
       if trigger.to_state is not none else '?' }}
  # A target can be an entity Home Assistant holds no state for at all --
  # a gate, a door controller with no integration -- so falling back to the
  # target's own id says more than 'Unknown lock' ever would.
  lock_name: >-
    {{ state_attr(lock_entity_id, 'friendly_name')
       | default(lock_entity_id, true)
       if lock_entity_id is not none else 'Unknown lock' }}
  timestamp: >-
    {{ (trigger.to_state.last_updated | as_local
        | as_timestamp | timestamp_custom('%Y-%m-%d %H:%M:%S'))
       if trigger.to_state is not none else '' }}
  operation: >-
    {{ trigger.to_state.attributes.operation | default('unknown', true)
       if trigger.to_state is not none else 'unknown' }}
  # The entity's event type is the kind of credential presented, not a place.
  credential_type: >-
    {{ trigger.to_state.attributes.event_type | default('unknown', true)
       if trigger.to_state is not none else 'unknown' }}

conditions:
  # Block transitions that aren't real PIN uses:
  #   - `from_state is None`     -> entity first-appearance after a
  #                                 config-entry reload or restart
  #                                 (Python None != the string
  #                                 'unknown', so `not_from` can't see
  #                                 this).
  #   - `to_state is None`       -> entity removal (LCM unload); the
  #                                 action's variables read
  #                                 `trigger.to_state.attributes` and
  #                                 would crash without this guard.
  #   - `from_state.state ==
  #      'unavailable'`           -> underlying lock dropped offline
  #                                 and recovered.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable' }}
  - condition: template
    value_template: >-
      {{ locks | count == 0 or lock_entity_id in locks }}

actions: !input notify_actions
